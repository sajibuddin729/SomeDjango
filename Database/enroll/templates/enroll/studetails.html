<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Page</h1>
    {% if stu %}
        <h2>{{stu}}</h2>
        <table>
            <tr>
                <th>ID</th>
                <th>StuId</th>
                <th>Name</th>
                <th>Email</th>
                <th>Pass</th>
                
            </tr>
            {% for st in stu %}
            <tr>
                <td>{{st.id}}</td>
                <td>{{st.stuid}}</td>
                <td>{{st.stuname}}</td>
                <td>{{st.stuemail}}</td>
                <td>{{st.stupass}}</td>
            </tr>
            
            
            
            
            
            {% endfor %}
        </table>

    {% else %}
        <h2>No data</h2>
    {% endif %}

    
</body>
</html>
